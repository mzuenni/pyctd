name: CI
on: [push, pull_request]

jobs:
  linux:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        python: ['3.10', 'pypy3.10']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Make sure that `git describe` (used by Hatch to dynamically generate the version) knows the Git history, but no data about trees/blobs is needed.
      - run: git fetch --prune --unshallow --filter=tree:0
      - run: python3 --version
      - run: python3 -m pip install --editable .
      - run: bash test/checktestdata_tests.sh
      - run: bash test/additional_tests.sh
      - run: bash test/strict_tests.sh
